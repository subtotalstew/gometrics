name: go vet test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  statictest:
    runs-on: ubuntu-latest
    container: golang:1.27
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build statictest
        run: |
          git clone --depth 1 https://github.com/Yandex-Practicum/go-autotests.git /tmp/go-autotests
          cd /tmp/go-autotests
          go build -o /usr/local/bin/statictest ./cmd/statictest

      - name: Run statictest
        run: |
          go vet -vettool=$(which statictest) ./...